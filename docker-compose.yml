x-app: &app
  image: mail-manager:app
  build: .
  restart: unless-stopped
  ports:
    # Bind em 0.0.0.0 para o Caddy (outro compose) alcançar via host.docker.internal.
    # A Hostinger só libera 22/80/443 — a 3010 não fica pública na internet.
    - "3010:3000"
  environment:
    DATABASE_URL: postgresql://mail:mail@db:5432/mail_manager?schema=public
    JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-32chars-min!!}
    JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    MAIL_DOMAIN: ${MAIL_DOMAIN:-financyexpert.com}
    MAIL_PROVIDER: ${MAIL_PROVIDER:-local}
    IMAP_HOST: ${IMAP_HOST:-mail.financyexpert.com}
    IMAP_PORT: ${IMAP_PORT:-993}
    IMAP_SECURE: ${IMAP_SECURE:-true}
    SMTP_HOST: ${SMTP_HOST:-mail.financyexpert.com}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    NODE_ENV: production
    PORT: "3000"
    WEB_DIST: /app/apps/web/dist
    WEB_ORIGIN: ${WEB_ORIGIN:-https://webmail.financyexpert.com}
  depends_on:
    db:
      condition: service_healthy
  healthcheck:
    test:
      [
        "CMD",
        "node",
        "-e",
        "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
      ]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 90s

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mail
      POSTGRES_PASSWORD: mail
      POSTGRES_DB: mail_manager
    volumes:
      - mail_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mail -d mail_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-blue:
    <<: *app

  app-green:
    <<: *app
    profiles: ["green"]

volumes:
  mail_pg_data:
